<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link class="mcpixel-logo-ref" rel="icon" type="image/jpg" href="../img/logo.jpg">
    <title>Iniciar Sesión - MCPixel</title>
    <style>
        :root {
            --bg-principal: #0b0c10;
            --bg-tarjeta: rgba(26, 29, 38, 0.65);
            --bg-barra: rgba(17, 19, 25, 0.95);
            --borde-glass: rgba(255, 255, 255, 0.08);
            --texto-principal: #f5f5f7;
            --texto-secundario: #94a3b8;
            --color-acento: #6366f1;
            --color-hover: #4f46e5;
            --color-error: #ef4444;
            --fuente: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --radio-suave: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--fuente);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .pantalla-contenedor {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: linear-gradient(145deg, rgba(26, 29, 38, 0.8) 0%, rgba(17, 19, 25, 0.8) 100%);
            border: 1px solid var(--borde-glass);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
            animation: aparecerContenedor 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .panel-lateral {
            display: none;
            flex: 1;
            padding: 48px;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(79, 70, 229, 0.05) 100%);
            border-right: 1px solid var(--borde-glass);
            animation: deslizarIzquierda 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .panel-lateral h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(to right, #ffffff, var(--texto-secundario));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .panel-lateral p {
            font-size: 16px;
            color: var(--texto-secundario);
            line-height: 1.6;
        }

        .login-contenedor {
            width: 100%;
            max-width: 450px;
            padding: 48px;
            margin: 0 auto;
            animation: deslizarDerecha 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        @media (min-width: 768px) {
            .panel-lateral {
                display: flex;
            }
            .login-contenedor {
                width: 50%;
                max-width: none;
            }
        }

        .login-cabecera {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: var(--radio-suave);
            margin-bottom: 16px;
        }

        .login-titulo {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-subtitulo {
            font-size: 14px;
            color: var(--texto-secundario);
        }

        .grupo-formulario {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label-formulario {
            font-size: 13px;
            font-weight: 600;
            color: var(--texto-secundario);
        }

        .input-contenedor {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-contenedor .icono-principal {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--texto-secundario);
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            pointer-events: none;
        }

        .btn-visibilidad {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--texto-secundario);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            outline: none;
        }

        .btn-visibilidad:hover {
            color: var(--texto-principal);
        }

        .btn-visibilidad svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .input-formulario {
            width: 100%;
            padding: 12px 42px 12px 42px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--borde-glass);
            border-radius: var(--radio-suave);
            color: var(--texto-principal);
            font-size: 15px;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-formulario:focus {
            border-color: var(--color-acento);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .msg-error {
            font-size: 12px;
            color: var(--color-error);
            display: none;
            margin-top: 4px;
            font-weight: 500;
        }

        .btn-enviar {
            width: 100%;
            padding: 12px;
            background: var(--color-acento);
            border: none;
            color: #ffffff;
            border-radius: var(--radio-suave);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-enviar:hover {
            background: var(--color-hover);
        }

        .login-pie {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--texto-secundario);
        }

        .login-pie a {
            color: var(--color-acento);
            text-decoration: none;
            font-weight: 600;
        }

        .login-pie a:hover {
            text-decoration: underline;
        }

        @keyframes aparecerContenedor {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes deslizarIzquierda {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes deslizarDerecha {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .animacion-salida {
            animation: salirContenedor 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes salirContenedor {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="pantalla-contenedor" id="contenedorPrincipal">
        <div class="panel-lateral">
            <h1>Bienvenid@ devuelta</h1>
            <p>Accede a tu cuenta para gestionar, actualizar y compartir tus Add-Ons, texturas y mundos de Minecraft Bedrock con toda la comunidad.</p>
        </div>

        <div class="login-contenedor">
            <div class="login-cabecera">
                <img src="../img/logo.jpg" alt="MCPixel Logo" class="logo">
                <h2 class="login-titulo">Bienvenido de nuevo</h2>
                <p class="login-subtitulo">Inicia sesión en tu cuenta de MCPixel</p>
            </div>

            <form id="formularioLogin" onsubmit="procesarLogin(event)">
                <div class="grupo-formulario">
                    <label class="label-formulario">Nombre de Usuario</label>
                    <div class="input-contenedor">
                        <svg class="icono-principal" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="loginUsuario" class="input-formulario" required placeholder="ejemplo" style="padding-right: 14px;">
                    </div>
                    <div class="msg-error" id="errorUsuario">El usuario no existe.</div>
                </div>

                <div class="grupo-formulario">
                    <label class="label-formulario">Contraseña</label>
                    <div class="input-contenedor">
                        <svg class="icono-principal" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="loginContrasena" class="input-formulario" required placeholder="••••••••">
                        <button type="button" class="btn-visibilidad" id="btnAlternarPassword" onclick="alternarVisibilidadPassword()">
                            <svg id="iconoOjo" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="msg-error" id="errorContrasena">Contraseña incorrecta.</div>
                </div>

                <button type="submit" class="btn-enviar" id="btnSubmit">Entrar</button>
            </form>

            <div class="login-pie">
                ¿No tienes cuenta? <a href="register" id="enlaceRegistro" onclick="transicionSalida(event, 'register.html')">Regístrate</a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uidkdvqfmqczgbclpbfb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZGtkdnFmbXFjemdiY2xwYmZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNzQyMjYsImV4cCI6MjEwMDc1MDIyNn0.rE33ZcEgRr7H3OUmNCWVwZaMv7AMMSqqptAQ5HJiCDI';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function alternarVisibilidadPassword() {
            const campoPassword = document.getElementById('loginContrasena');
            const iconoOjo = document.getElementById('iconoOjo');
            
            if (campoPassword.type === 'password') {
                campoPassword.type = 'text';
                iconoOjo.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                campoPassword.type = 'password';
                iconoOjo.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        function transicionSalida(e, url) {
            e.preventDefault();
            const contenedor = document.getElementById('contenedorPrincipal');
            contenedor.classList.add('animacion-salida');
            setTimeout(function() {
                window.location.href = url;
            }, 350);
        }

        async function procesarLogin(e) {
            e.preventDefault();
            
            const usuarioInput = document.getElementById('loginUsuario').value.trim().toLowerCase();
            const contrasenaInput = document.getElementById('loginContrasena').value;
            
            const errorUsuario = document.getElementById('errorUsuario');
            const errorContrasena = document.getElementById('errorContrasena');
            const btnSubmit = document.getElementById('btnSubmit');
            
            errorUsuario.style.display = 'none';
            errorContrasena.style.display = 'none';
            btnSubmit.textContent = 'Entrando...';
            btnSubmit.disabled = true;

            const emailFantasma = `${usuarioInput}@mcpixel.com`;

            try {
                const { data: usuarioData, error: usuarioError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('username', usuarioInput)
                    .maybeSingle();

                if (usuarioError) throw usuarioError;

                if (!usuarioData) {
                    errorUsuario.style.display = 'block';
                    btnSubmit.textContent = 'Entrar';
                    btnSubmit.disabled = false;
                    return;
                }

                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: emailFantasma,
                    password: contrasenaInput
                });

                if (authError) {
                    if (authError.message.includes('Invalid login credentials')) {
                        errorContrasena.style.display = 'block';
                    } else {
                        alert(authError.message);
                    }
                    btnSubmit.textContent = 'Entrar';
                    btnSubmit.disabled = false;
                    return;
                }

                const nombreFinal = usuarioData.nombre_visible || usuarioData.username;
                const avatarFinal = usuarioData.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80';

                localStorage.setItem('mcpixel_interfaz_v2_sesion', nombreFinal);
                localStorage.setItem('mcpixel_interfaz_v2_avatar', avatarFinal);
                
                window.location.href = '../';

            } catch (error) {
                console.error(error);
                alert('Error al intentar iniciar sesión.');
                btnSubmit.textContent = 'Entrar';
                btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>
