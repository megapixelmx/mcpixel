<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="../img/logo.jpg">
    <title>Verificando Acceso - MCPixel</title>
    <style>
        :root {
            --bg-principal: #0b0c10;
            --bg-tarjeta: rgba(26, 29, 38, 0.85);
            --borde-glass: rgba(255, 255, 255, 0.08);
            --texto-principal: #f5f5f7;
            --texto-secundario: #94a3b8;
            --color-acento: #6366f1;
            --fuente: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--fuente);
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .contenedor-ads {
            max-width: 420px;
            width: 100%;
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde-glass);
            border-radius: 20px;
            padding: 36px 24px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top: 4px solid var(--color-acento);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: var(--texto-secundario);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="contenedor-ads">
        <div class="spinner"></div>
        <h1>Verificando acceso...</h1>
        <p>Guardando validación de anuncios por 24 horas y redirigiendo al inicio.</p>
    </div>

    <script>
        const CLAVE_LOCALSTORAGE_ADS = 'mcpixel_ads_expiracion';
        const DURACION_24_HORAS_MS = 24 * 60 * 60 * 1000;

        function procesarAutenticacionAutomatica() {
            const tiempoExpiracion = Date.now() + DURACION_24_HORAS_MS;
            localStorage.setItem(CLAVE_LOCALSTORAGE_ADS, tiempoExpiracion.toString());

            setTimeout(() => {
                window.location.href = '/';
            }, 300); 
        }

        document.addEventListener('DOMContentLoaded', procesarAutenticacionAutomatica);
    </script>
</body>
</html>
