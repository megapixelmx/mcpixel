<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="../img/logo.jpg">
    <title>Desbloquear Enlace - MCPixel</title>
    <style>
        :root {
            --bg-principal: #0b0c10;
            --bg-tarjeta: rgba(26, 29, 38, 0.85);
            --borde-glass: rgba(255, 255, 255, 0.08);
            --texto-principal: #f5f5f7;
            --texto-secundario: #94a3b8;
            --color-acento: #6366f1;
            --color-hover: #4f46e5;
            --fuente: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --radio-suave: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--fuente);
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .contenedor-ads {
            max-width: 480px;
            width: 100%;
            background: var(--bg-tarjeta);
            border: 1px solid var(--borde-glass);
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .icono-candado {
            width: 60px;
            height: 60px;
            background: rgba(99, 102, 241, 0.15);
            color: var(--color-acento);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .icono-candado svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: var(--texto-secundario);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-completar-ads {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 20px;
            background: var(--color-acento);
            color: #ffffff;
            border: none;
            border-radius: var(--radio-suave);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-completar-ads:hover {
            background: var(--color-hover);
            transform: translateY(-1px);
        }

        .btn-completar-ads.deshabilitado {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .contador {
            font-size: 13px;
            color: var(--texto-secundario);
            margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="contenedor-ads">
        <div class="icono-candado">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <h1>Verificación de Anuncios</h1>
        <p>Haz clic en el botón a continuación para validar la visualización de anuncios y desbloquear la descarga durante 24 horas.</p>
        
        <button id="btnVerificarAds" class="btn-completar-ads">
            Confirmar y Desbloquear Descarga
        </button>

        <div class="contador" id="textoEstado">Validando acceso...</div>
    </div>

    <script>
        const CLAVE_LOCALSTORAGE_ADS = 'mcpixel_ads_expiracion';
        const DURACION_24_HORAS_MS = 24 * 60 * 60 * 1000;

        function obtenerParametrosURL() {
            return new URLSearchParams(window.location.search);
        }

        function guardarEstadoAnuncios() {
            const tiempoExpiracion = Date.now() + DURACION_24_HORAS_MS;
            localStorage.setItem(CLAVE_LOCALSTORAGE_ADS, tiempoExpiracion.toString());
        }

        function redirigirAView() {
            guardarEstadoAnuncios();
            
            const params = obtenerParametrosURL();
            const idAddon = params.get('id');
            const targetUrl = params.get('target');

            // Si se paso una URL directa de destino
            if (targetUrl && targetUrl.startsWith('http')) {
                window.location.href = targetUrl;
                return;
            }

            // Si hay un ID de complemento, regresa a view.html pasando la confirmación
            if (idAddon) {
                window.location.href = `view.html?id=${encodeURIComponent(idAddon)}&ads_verified=true`;
            } else {
                // Redirección por defecto a inicio o view genérico
                window.location.href = `view.html?ads_verified=true`;
            }
        }

        document.getElementById('btnVerificarAds').addEventListener('click', () => {
            const btn = document.getElementById('btnVerificarAds');
            btn.classList.add('deshabilitado');
            btn.textContent = 'Procesando...';
            document.getElementById('textoEstado').textContent = 'Guardando estado de verificación...';

            setTimeout(() => {
                redirigirAView();
            }, 800);
        });

        // Auto-verificación opcional si se invoca con ?auto=true en la URL
        window.addEventListener('DOMContentLoaded', () => {
            const params = obtenerParametrosURL();
            if (params.get('auto') === 'true') {
                redirigirAView();
            } else {
                document.getElementById('textoEstado').textContent = 'Listo para confirmar.';
            }
        });
    </script>
</body>
</html>
