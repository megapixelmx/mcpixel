<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        .error-title {
            color: #ef4444;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card" id="status-card">
        <div class="loader" id="loader"></div>
        <p id="status-text">Verificando acceso...</p>
    </div>

    <script>
        (function() {
            const ONE_DAY_MS = 86400000;
            const now = Date.now();

            function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return parts.pop().split(';').shift();
                return null;
            }

            function isSessionValid() {
                const authTime = localStorage.getItem('ads_verified_time');
                const hasCookie = getCookie('ads_verified') === 'true';

                if (authTime && (now - parseInt(authTime, 10) < ONE_DAY_MS)) {
                    return true;
                }
                if (hasCookie && authTime) {
                    return (now - parseInt(authTime, 10) < ONE_DAY_MS);
                }
                return false;
            }

            function validateOrigin() {
                const referrer = document.referrer.toLowerCase();
                const urlParams = new URLSearchParams(window.location.search);
                
                const hasCutyReferrer = referrer.includes('cuty.io') || referrer.includes('cuty.net');
                const hasParamAuth = urlParams.has('verified') || urlParams.has('v') || urlParams.get('ref') === 'cuty';

                return hasCutyReferrer || hasParamAuth;
            }

            if (isSessionValid()) {
                redirectUser();
                return;
            }

            if (validateOrigin()) {
                const array = new Uint8Array(16);
                crypto.getRandomValues(array);
                const tokenUnico = Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');

                const expires = new Date(now + ONE_DAY_MS).toUTCString();
                document.cookie = "ads_verified=true; path=/; expires=" + expires + "; SameSite=Lax";
                
                localStorage.setItem('ads_verified', 'true');
                localStorage.setItem('ads_verified_time', now.toString());
                localStorage.setItem('temp_auth_code', tokenUnico);

                redirectUser();
            } else {
                document.getElementById('status-card').innerHTML = `
                    <h1 class="error-title">Acceso Denegado</h1>
                    <p style="color: #94a3b8;">Error: Debes pasar por la verificación requerida antes de acceder a este sitio.</p>
                `;
            }

            function redirectUser() {
                const urlParams = new URLSearchParams(window.location.search);
                const returnUrl = urlParams.get('redirect') || urlParams.get('return') || '/';

                setTimeout(() => {
                    window.location.href = returnUrl;
                }, 400);
            }
        })();
    </script>
</body>
</html>
